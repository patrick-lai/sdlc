<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frontend PR Review</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b0f;
        --bg-subtle: #0e1117;
        --surface: #12161d;
        --surface-2: #171c25;
        --surface-3: #1d2430;
        --ink: #eef1f6;
        --muted: #a7b0bf;
        --faint: #727b8a;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --accent: #5b9dff;
        --accent-soft: rgba(91, 157, 255, 0.12);
        --blocked: #ff7b72;
        --blocked-bg: rgba(255, 123, 114, 0.1);
        --blocked-line: rgba(255, 123, 114, 0.35);
        --passable: #3dd68c;
        --passable-bg: rgba(61, 214, 140, 0.1);
        --passable-line: rgba(61, 214, 140, 0.35);
        --unverified: #f0b429;
        --unverified-bg: rgba(240, 180, 41, 0.1);
        --unverified-line: rgba(240, 180, 41, 0.35);
        --warn: #ffb86b;
        --ok: #7ee787;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        --radius: 10px;
        --radius-sm: 6px;
        --font: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Helvetica Neue", sans-serif;
        --mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
        --sidebar: 240px;
      }

      html[data-theme="light"] {
        color-scheme: light;
        --bg: #f6f7f9;
        --bg-subtle: #eef0f4;
        --surface: #ffffff;
        --surface-2: #fbfbfc;
        --surface-3: #f3f4f7;
        --ink: #111827;
        --muted: #4b5563;
        --faint: #6b7280;
        --line: rgba(17, 24, 39, 0.08);
        --line-strong: rgba(17, 24, 39, 0.14);
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.08);
        --blocked: #dc2626;
        --blocked-bg: #fef2f2;
        --blocked-line: rgba(220, 38, 38, 0.25);
        --passable: #059669;
        --passable-bg: #ecfdf5;
        --passable-line: rgba(5, 150, 105, 0.25);
        --unverified: #b45309;
        --unverified-bg: #fffbeb;
        --unverified-line: rgba(180, 83, 9, 0.25);
        --warn: #d97706;
        --ok: #059669;
        --shadow: 0 12px 40px rgba(17, 24, 39, 0.08);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      a[target="_blank"]::after {
        content: " ↗";
        font-size: 0.85em;
        opacity: 0.65;
      }

      code,
      .mono {
        font-family: var(--mono);
        font-size: 0.92em;
      }

      .top {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 52px;
        padding: 0 20px;
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .mark {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
        flex: 0 0 auto;
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-copy strong {
        display: block;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .brand-copy span {
        display: block;
        color: var(--faint);
        font: 11px/1.2 var(--mono);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--line-strong);
        background: var(--surface-2);
        color: var(--muted);
        border-radius: var(--radius-sm);
        padding: 6px 10px;
        font: 650 11px/1 var(--font);
        cursor: pointer;
      }

      .btn:hover {
        color: var(--ink);
        border-color: var(--line-strong);
        background: var(--surface-3);
      }

      .badge {
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 5px 8px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        color: var(--faint);
      }

      .verdict {
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .verdict-inner {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 18px 0 16px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: end;
      }

      .verdict h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 38px);
        line-height: 1.05;
        letter-spacing: -0.04em;
        font-weight: 700;
      }

      .verdict[data-tone="blocked"] h1 {
        color: var(--blocked);
      }
      .verdict[data-tone="passable"] h1 {
        color: var(--passable);
      }
      .verdict[data-tone="unverified"] h1 {
        color: var(--unverified);
      }

      .verdict p {
        margin: 8px 0 0;
        max-width: 62ch;
        color: var(--muted);
        font-size: 14px;
      }

      .verdict-chip {
        justify-self: end;
        padding: 10px 14px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--surface-2);
        font: 650 11px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .verdict[data-tone="blocked"] .verdict-chip {
        border-color: var(--blocked-line);
        background: var(--blocked-bg);
        color: var(--blocked);
      }
      .verdict[data-tone="passable"] .verdict-chip {
        border-color: var(--passable-line);
        background: var(--passable-bg);
        color: var(--passable);
      }
      .verdict[data-tone="unverified"] .verdict-chip {
        border-color: var(--unverified-line);
        background: var(--unverified-bg);
        color: var(--unverified);
      }

      .layout {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 20px 0 56px;
        display: grid;
        grid-template-columns: var(--sidebar) minmax(0, 1fr);
        gap: 28px;
        align-items: start;
      }

      .sidebar {
        position: sticky;
        top: 72px;
        display: grid;
        gap: 14px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px;
        box-shadow: var(--shadow);
      }

      .panel h2 {
        margin: 0 0 10px;
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
      }

      .search {
        width: 100%;
        border: 1px solid var(--line-strong);
        background: var(--bg-subtle);
        color: var(--ink);
        border-radius: var(--radius-sm);
        padding: 9px 10px;
        font: 13px/1.2 var(--font);
      }

      .search::placeholder {
        color: var(--faint);
      }

      .nav {
        display: grid;
        gap: 4px;
      }

      .nav a {
        display: block;
        padding: 7px 8px;
        border-radius: var(--radius-sm);
        color: var(--muted);
        font-size: 12.5px;
      }

      .nav a:hover,
      .nav a.is-active {
        background: var(--accent-soft);
        color: var(--ink);
        text-decoration: none;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .pill {
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--muted);
        border-radius: 999px;
        padding: 5px 9px;
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .pill[aria-pressed="true"] {
        border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
        background: var(--accent-soft);
        color: var(--ink);
      }

      .main {
        min-width: 0;
        display: grid;
        gap: 18px;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .meta-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        font-size: 12px;
      }

      .meta-chip strong {
        color: var(--faint);
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .copy {
        border: 0;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        padding: 0;
        font: 650 10px/1 var(--mono);
      }

      .copy:hover {
        color: var(--accent);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .metric {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 14px;
      }

      .metric b {
        display: block;
        font: 700 24px/1 var(--mono);
        letter-spacing: -0.04em;
      }

      .metric span {
        display: block;
        margin-top: 5px;
        color: var(--faint);
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .metric[data-tone="blocked"] b {
        color: var(--blocked);
      }
      .metric[data-tone="passable"] b {
        color: var(--passable);
      }
      .metric[data-tone="unverified"] b {
        color: var(--unverified);
      }

      .section {
        scroll-margin-top: 88px;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .section-head h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.03em;
        font-weight: 650;
      }

      .section-head p {
        margin: 0;
        color: var(--faint);
        font-size: 12px;
      }

      .card-list {
        display: grid;
        gap: 10px;
      }

      .finding {
        display: grid;
        grid-template-columns: 4px minmax(0, 1fr);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--surface);
      }

      .finding[data-hidden="true"],
      .facet-row[data-hidden="true"] {
        display: none;
      }

      .finding-rail {
        background: var(--faint);
      }

      .finding[data-group="blocking"] .finding-rail {
        background: var(--blocked);
      }
      .finding[data-group="non-blocking"] .finding-rail {
        background: var(--warn);
      }
      .finding[data-group="unverified"] .finding-rail {
        background: var(--unverified);
      }

      .finding-body {
        padding: 12px 14px 10px;
        min-width: 0;
      }

      .finding-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .finding-title {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .finding-meta {
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag {
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 4px 6px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        background: var(--surface-2);
      }

      .tag[data-tone="blocked"] {
        color: var(--blocked);
        border-color: var(--blocked-line);
        background: var(--blocked-bg);
      }
      .tag[data-tone="ok"] {
        color: var(--ok);
      }
      .tag[data-tone="unverified"] {
        color: var(--unverified);
        border-color: var(--unverified-line);
        background: var(--unverified-bg);
      }

      .finding summary {
        cursor: pointer;
        list-style: none;
        margin-top: 10px;
        color: var(--accent);
        font: 650 12px/1 var(--font);
      }

      .finding summary::-webkit-details-marker {
        display: none;
      }

      .finding details[open] summary {
        margin-bottom: 10px;
      }

      .kv {
        display: grid;
        gap: 8px;
        margin: 0;
      }

      .kv div {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        gap: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }

      .kv dt {
        margin: 0;
        color: var(--faint);
        font: 650 10px/1.4 var(--mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .kv dd {
        margin: 0;
        color: var(--muted);
      }

      .table-wrap {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: auto;
        background: var(--surface);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
      }

      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        position: sticky;
        top: 0;
        background: var(--surface-2);
        color: var(--faint);
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .status {
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .status[data-tone="ok"] {
        color: var(--ok);
      }
      .status[data-tone="warn"] {
        color: var(--warn);
      }
      .status[data-tone="unverified"] {
        color: var(--unverified);
      }
      .status[data-tone="muted"] {
        color: var(--faint);
      }

      .gate-banner {
        display: grid;
        gap: 8px;
        padding: 14px 16px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: linear-gradient(180deg, var(--surface-2), var(--surface));
      }

      .gate-banner strong {
        font-size: 14px;
      }

      .gate-keys {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .empty {
        padding: 22px 16px;
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius);
        color: var(--faint);
        background: var(--surface);
      }

      .foot {
        color: var(--faint);
        font-size: 12px;
      }

      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }

        .metrics {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 640px) {
        .verdict-inner {
          grid-template-columns: 1fr;
        }

        .verdict-chip {
          justify-self: start;
        }

        .metrics {
          grid-template-columns: 1fr;
        }

        .kv div {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div class="brand-copy">
          <strong>Frontend PR Review</strong>
          <span id="brand-meta">Evidence report</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn" id="theme-toggle" type="button">Theme</button>
        <span class="badge">Read-only</span>
      </div>
    </header>

    <section class="verdict" id="verdict" data-tone="unverified">
      <div class="verdict-inner">
        <div>
          <h1 id="verdict-title">Unverified</h1>
          <p id="verdict-rationale">Loading report…</p>
        </div>
        <div class="verdict-chip" id="verdict-chip">Advice only</div>
      </div>
    </section>

    <div class="layout">
      <aside class="sidebar">
        <div class="panel">
          <h2>Find in report</h2>
          <input
            class="search"
            id="search"
            type="search"
            placeholder="Search findings, facets, files…"
            autocomplete="off"
          />
        </div>
        <div class="panel">
          <h2>Jump</h2>
          <nav class="nav" id="nav"></nav>
        </div>
        <div class="panel">
          <h2>Filter findings</h2>
          <div class="filters" id="finding-filters"></div>
        </div>
        <div class="panel">
          <h2>Filter facets</h2>
          <div class="filters" id="facet-filters"></div>
        </div>
      </aside>

      <main class="main" id="app"></main>
    </div>

    <script type="application/json" id="fe-review-report">
      __FE_REVIEW_REPORT_JSON__
    </script>
    <script>
      ;(function () {
        const raw = document.getElementById('fe-review-report').textContent.trim()
        let data
        try {
          data = JSON.parse(raw)
        } catch {
          data = {
            schema: 'sdlc.fe-pr-review.report/v1',
            verdict: { value: 'unverified', label: 'Unverified', tone: 'unverified', rationale: 'Invalid report payload.' },
            counts: { blocking: 0, nonBlocking: 0, unverifiedFindings: 0, facets: 0, facetsUnverified: 0 },
            findings: [],
            coverage: [],
            gatePath: [],
            qa: { status: 'not-run', reason: 'Invalid report payload.' },
            featureGate: { status: 'unverified', keys: [], rationale: '', evidence: [] },
            snapshot: { h0: 'unknown', base: 'unknown', diffHash: 'unknown', shortH0: 'unknown' },
            generatedAt: null,
          }
        }

        const app = document.getElementById('app')
        const nav = document.getElementById('nav')
        const search = document.getElementById('search')
        const themeToggle = document.getElementById('theme-toggle')
        const storedTheme = localStorage.getItem('fe-pr-review-theme')
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.dataset.theme = storedTheme
        }

        themeToggle.addEventListener('click', () => {
          const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'
          document.documentElement.dataset.theme = next
          localStorage.setItem('fe-pr-review-theme', next)
        })

        document.getElementById('brand-meta').textContent =
          formatWhen(data.generatedAt) + ' · H0 ' + (data.snapshot?.shortH0 || 'unknown')

        const verdictEl = document.getElementById('verdict')
        verdictEl.dataset.tone = data.verdict?.tone || data.verdict?.value || 'unverified'
        document.getElementById('verdict-title').textContent = data.verdict?.label || titleCase(data.verdict?.value)
        document.getElementById('verdict-rationale').textContent = data.verdict?.rationale || ''
        document.getElementById('verdict-chip').textContent =
          (data.verdict?.value || 'unverified') + ' · advice only'

        const sections = [
          { id: 'snapshot', title: 'Snapshot' },
          { id: 'findings', title: 'Findings' },
          { id: 'feature-gate', title: 'Feature gate' },
          { id: 'coverage', title: 'Every review facet' },
          { id: 'qa', title: 'QA evidence' },
          { id: 'limitations', title: 'Limitations' },
        ]

        for (const section of sections) {
          nav.appendChild(el('a', { href: '#section-' + section.id, 'data-nav': section.id }, [section.title]))
        }

        app.appendChild(renderSnapshot(data))
        app.appendChild(renderMetrics(data))
        app.appendChild(renderFindings(data))
        app.appendChild(renderFeatureGate(data))
        app.appendChild(renderCoverage(data))
        app.appendChild(renderQa(data))
        app.appendChild(renderLimitations(data))
        app.appendChild(
          el('p', { class: 'foot' }, [
            (data.schema || 'sdlc.fe-pr-review.report/v1') +
              ' · ' +
              (data.counts?.facets || 0) +
              ' facets · read-only evidence',
          ]),
        )

        wireFindingFilters(data)
        wireFacetFilters(data)
        wireSearch()
        wireNav()

        function renderSnapshot(data) {
          const section = sectionShell('snapshot', 'Snapshot', 'Immutable head and diff anchors for staleness checks.')
          const row = el('div', { class: 'meta-row' })
          row.appendChild(metaChip('Head H0', data.snapshot?.h0, 'h0'))
          row.appendChild(metaChip('Base', data.snapshot?.base, 'base'))
          row.appendChild(metaChip('Diff SHA-256', data.snapshot?.diffHash, 'diff'))
          row.appendChild(
            metaChip('QA', String(data.qa?.status || 'not-run').toUpperCase(), null, false),
          )
          section.appendChild(row)
          if (data.failedNodes?.length) {
            section.appendChild(
              el('div', { class: 'gate-banner', style: 'margin-top:10px;border-color:var(--unverified-line)' }, [
                el('strong', {}, [String(data.failedNodes.length) + ' reviewer node(s) failed']),
                el('p', { style: 'margin:0;color:var(--muted)' }, [
                  data.failedNodes.map((n) => n.persona + ': ' + n.error).join(' · '),
                ]),
              ]),
            )
          }
          return section
        }

        function renderMetrics(data) {
          const wrap = el('div', { class: 'metrics', role: 'group', 'aria-label': 'Review counts' })
          wrap.appendChild(metric('blocking', 'Blocking', data.counts?.blocking))
          wrap.appendChild(metric('passable', 'Non-blocking', data.counts?.nonBlocking))
          wrap.appendChild(metric('unverified', 'Unverified claims', data.counts?.unverifiedFindings))
          wrap.appendChild(metric('unverified', 'Unverified facets', data.counts?.facetsUnverified))
          return wrap
        }

        function renderFindings(data) {
          const section = sectionShell(
            'findings',
            'Findings',
            'Blocking items first. Expand for execution path, disconfirming evidence, and verification.',
          )
          const list = el('div', { class: 'card-list', id: 'finding-list' })
          if (!data.findings?.length) {
            list.appendChild(el('p', { class: 'empty' }, ['No synthesized findings.']))
          } else {
            for (const finding of data.findings) list.appendChild(renderFinding(finding))
          }
          section.appendChild(list)
          return section
        }

        function renderFinding(finding) {
          const details = el('details')
          details.appendChild(el('summary', {}, ['Show evidence trail']))
          const kv = el('dl', { class: 'kv' })
          if (finding.impact) kv.appendChild(kvRow('Impact', finding.impact))
          if (finding.trigger) kv.appendChild(kvRow('Trigger', finding.trigger))
          if (finding.executionPath?.length)
            kv.appendChild(kvRow('Path', finding.executionPath.join(' → ')))
          if (finding.violatedContract) kv.appendChild(kvRow('Contract', finding.violatedContract))
          if (finding.evidence?.length)
            kv.appendChild(kvRow('Evidence', finding.evidence.map(linkText).join('<br>'), true))
          if (finding.disconfirmingReason)
            kv.appendChild(kvRow('Disconfirm', finding.disconfirmingReason))
          if (finding.suggestedFix) kv.appendChild(kvRow('Fix', finding.suggestedFix))
          if (finding.verification) kv.appendChild(kvRow('Verify', finding.verification))
          details.appendChild(kv)

          const tags = el('div', { class: 'finding-meta' })
          tags.appendChild(tag(finding.group, finding.group === 'blocking' ? 'blocked' : finding.group === 'unverified' ? 'unverified' : 'warn'))
          if (finding.lens) tags.appendChild(tag(finding.lens, 'muted'))
          if (finding.location) tags.appendChild(tag(finding.location, 'muted'))
          if (finding.confidence != null)
            tags.appendChild(tag(Math.round(finding.confidence * 100) + '% conf', 'muted'))

          const article = el('article', {
            class: 'finding',
            id: 'finding-' + finding.id,
            'data-group': finding.group,
            'data-search': buildSearchText(finding),
          }, [
            el('div', { class: 'finding-rail', 'aria-hidden': 'true' }),
            el('div', { class: 'finding-body' }, [
              el('div', { class: 'finding-top' }, [
                el('div', {}, [
                  el('h3', { class: 'finding-title' }, [finding.title]),
                  tags,
                ]),
                el('button', { class: 'copy', type: 'button', 'data-copy-hash': 'finding-' + finding.id }, ['Copy link']),
              ]),
              el('p', { style: 'margin:8px 0 0;color:var(--muted)' }, [finding.summary]),
              details,
            ]),
          ])
          return article
        }

        function renderFeatureGate(data) {
          const section = sectionShell(
            'feature-gate',
            'Feature-gate decision',
            'Rollout requirement and the full fg-* path.',
          )
          const banner = el('div', { class: 'gate-banner' }, [
            el('strong', {}, ['Required: ' + titleCase(data.featureGate?.status)]),
            el('p', { style: 'margin:0;color:var(--muted)' }, [data.featureGate?.rationale || '']),
          ])
          const keys = el('div', { class: 'gate-keys' })
          if (data.featureGate?.keys?.length) {
            for (const key of data.featureGate.keys) keys.appendChild(tag(key, 'muted'))
          } else {
            keys.appendChild(tag('none established', 'unverified'))
          }
          banner.appendChild(keys)
          if (data.featureGate?.evidence?.length) {
            banner.appendChild(
              el('p', { style: 'margin:0;color:var(--faint);font-size:12px' }, [
                html('Evidence: ' + data.featureGate.evidence.map(linkText).join(' · ')),
              ]),
            )
          }
          section.appendChild(banner)

          section.appendChild(el('div', { class: 'section-head', style: 'margin-top:16px' }, [
            el('h2', { style: 'font-size:15px' }, ['Full feature-gate path']),
            el('p', {}, [String(data.gatePath?.length || 0) + ' facets']),
          ]))

          section.appendChild(renderFacetTable(data.gatePath, 'gate-table'))
          return section
        }

        function renderCoverage(data) {
          const section = sectionShell(
            'coverage',
            'Every review facet',
            'Filter by reviewer lens or status. Search matches facet IDs and summaries.',
          )
          section.appendChild(renderFacetTable(data.coverage || [], 'coverage-table'))
          return section
        }

        function renderFacetTable(rows, id) {
          const wrap = el('div', { class: 'table-wrap' })
          const table = el('table', { id })
          table.appendChild(
            el('thead', {}, [
              el('tr', {}, [
                el('th', {}, ['Reviewer']),
                el('th', {}, ['Facet']),
                el('th', {}, ['Status']),
                el('th', {}, ['Established']),
                el('th', {}, ['Evidence / limitation']),
              ]),
            ]),
          )
          const body = el('tbody')
          for (const row of rows || []) {
            const tone = statusTone(row.status)
            body.appendChild(
              el('tr', {
                class: 'facet-row',
                'data-persona': row.persona,
                'data-status': row.status,
                'data-search': [row.persona, row.id, row.status, row.summary, ...(row.evidence || [])].join(' '),
              }, [
                el('td', {}, [row.persona]),
                el('td', { class: 'mono' }, [row.id]),
                el('td', {}, [el('span', { class: 'status', 'data-tone': tone }, [row.status])]),
                el('td', {}, [row.summary]),
                el('td', {}, [html((row.evidence || []).map(linkText).join('; '))]),
              ]),
            )
          }
          table.appendChild(body)
          wrap.appendChild(table)
          return wrap
        }

        function renderQa(data) {
          const section = sectionShell('qa', 'QA evidence', 'Fresh qa-demo output only counts as proof.')
          const banner = el('div', { class: 'gate-banner' }, [
            el('strong', {}, ['Status: ' + String(data.qa?.status || 'not-run').toUpperCase()]),
            el('p', { style: 'margin:0;color:var(--muted)' }, [data.qa?.reason || '']),
          ])
          const meta = el('div', { class: 'meta-row', style: 'margin-top:10px' })
          meta.appendChild(metaChip('Revision', data.qa?.revision || 'not established', null, false))
          meta.appendChild(metaChip('Artifact hash', data.qa?.hash || 'none', null, false))
          section.appendChild(banner)
          section.appendChild(meta)
          return section
        }

        function renderLimitations(data) {
          const section = sectionShell('limitations', 'Limitations', 'Uncovered or unverified facets remain private uncertainty.')
          if (!data.limitations?.length) {
            section.appendChild(el('p', { class: 'empty' }, ['None reported by reviewer nodes.']))
            return section
          }
          const list = el('div', { class: 'card-list' })
          for (const row of data.limitations) {
            list.appendChild(
              el('article', {
                class: 'finding',
                'data-search': [row.persona, row.id, row.summary, ...(row.evidence || [])].join(' '),
              }, [
                el('div', { class: 'finding-rail', style: 'background:var(--unverified)' }),
                el('div', { class: 'finding-body' }, [
                  el('h3', { class: 'finding-title' }, [row.persona + ' / ' + row.id]),
                  el('p', { style: 'margin:6px 0 0;color:var(--muted)' }, [row.summary]),
                  el('p', { style: 'margin:8px 0 0;color:var(--faint);font-size:12px' }, [
                    html((row.evidence || []).map(linkText).join(' · ')),
                  ]),
                ]),
              ]),
            )
          }
          section.appendChild(list)
          return section
        }

        function wireFindingFilters(data) {
          const host = document.getElementById('finding-filters')
          const groups = ['all', 'blocking', 'non-blocking', 'unverified']
          for (const group of groups) {
            const count =
              group === 'all'
                ? data.findings?.length || 0
                : (data.findings || []).filter((f) => f.group === group).length
            host.appendChild(
              filterPill(group, group === 'all' ? 'All' : titleCase(group), count, group === 'all', applyFindingFilter),
            )
          }
        }

        function wireFacetFilters(data) {
          const host = document.getElementById('facet-filters')
          const personas = ['all', ...new Set((data.coverage || []).map((r) => r.persona))]
          for (const persona of personas) {
            const count =
              persona === 'all'
                ? data.coverage?.length || 0
                : (data.coverage || []).filter((r) => r.persona === persona).length
            host.appendChild(
              filterPill('persona-' + persona, persona === 'all' ? 'All' : persona, count, persona === 'all', applyFacetFilter),
            )
          }
        }

        function filterPill(id, label, count, pressed, onClick) {
          const btn = el('button', {
            class: 'pill',
            type: 'button',
            id: 'filter-' + id,
            'data-filter': id,
            'aria-pressed': String(pressed),
          }, [label + ' · ' + count])
          btn.addEventListener('click', () => onClick(id, btn))
          return btn
        }

        let activeFindingFilter = 'all'
        let activeFacetFilter = 'all'

        function applyFindingFilter(id, btn) {
          activeFindingFilter = id
          for (const pill of document.querySelectorAll('#finding-filters .pill')) {
            pill.setAttribute('aria-pressed', String(pill.dataset.filter === id))
          }
          applySearch()
        }

        function applyFacetFilter(id, btn) {
          activeFacetFilter = id.replace(/^persona-/, '')
          for (const pill of document.querySelectorAll('#facet-filters .pill')) {
            pill.setAttribute(
              'aria-pressed',
              String(pill.dataset.filter.replace(/^persona-/, '') === activeFacetFilter),
            )
          }
          applySearch()
        }

        function wireSearch() {
          search.addEventListener('input', applySearch)
          document.addEventListener('click', (event) => {
            const target = event.target
            if (!(target instanceof HTMLElement)) return
            const value = target.dataset.copy || target.dataset.copyHash
            if (!value) return
            const url = target.dataset.copyHash
              ? location.origin + location.pathname + location.search + '#' + value
              : value
            navigator.clipboard?.writeText(url)
          })
        }

        function applySearch() {
          const q = search.value.trim().toLowerCase()
          for (const node of document.querySelectorAll('.finding[data-group]')) {
            const group = node.getAttribute('data-group')
            const text = (node.getAttribute('data-search') || node.textContent || '').toLowerCase()
            const groupOk = activeFindingFilter === 'all' || activeFindingFilter === group
            const searchOk = !q || text.includes(q)
            node.setAttribute('data-hidden', String(!(groupOk && searchOk)))
          }
          for (const row of document.querySelectorAll('.facet-row')) {
            const persona = row.getAttribute('data-persona')
            const text = (row.getAttribute('data-search') || row.textContent || '').toLowerCase()
            const personaOk = activeFacetFilter === 'all' || activeFacetFilter === persona
            const searchOk = !q || text.includes(q)
            row.setAttribute('data-hidden', String(!(personaOk && searchOk)))
          }
        }

        function wireNav() {
          const links = [...document.querySelectorAll('[data-nav]')]
          const observer = new IntersectionObserver(
            (entries) => {
              for (const entry of entries) {
                if (!entry.isIntersecting) continue
                for (const link of links) link.classList.remove('is-active')
                const active = document.querySelector('[data-nav="' + entry.target.id.replace(/^section-/, '') + '"]')
                if (active) active.classList.add('is-active')
              }
            },
            { rootMargin: '-40% 0px -50% 0px', threshold: 0.01 },
          )
          for (const link of links) {
            const id = link.getAttribute('data-nav')
            const section = document.getElementById('section-' + id)
            if (section) observer.observe(section)
          }
        }

        function sectionShell(id, title, helper) {
          return el('section', { class: 'section', id: 'section-' + id }, [
            el('div', { class: 'section-head' }, [el('h2', {}, [title]), el('p', {}, [helper])]),
          ])
        }

        function metric(tone, label, value) {
          return el('div', { class: 'metric', 'data-tone': tone }, [
            el('b', {}, [String(value ?? 0)]),
            el('span', {}, [label]),
          ])
        }

        function metaChip(label, value, copyKey, withButton = true) {
          const chip = el('span', { class: 'meta-chip' }, [
            el('strong', {}, [label]),
            el('span', { class: 'mono' }, [value || 'unknown']),
          ])
          if (withButton && copyKey) {
            chip.appendChild(el('button', { class: 'copy', type: 'button', 'data-copy': String(value || '') }, ['Copy']))
          }
          return chip
        }

        function tag(label, tone) {
          return el('span', { class: 'tag', 'data-tone': tone || 'muted' }, [label])
        }

        function kvRow(label, value, asHtml = false) {
          const dd = el('dd', {})
          if (asHtml || (typeof value === 'string' && value.includes('<'))) dd.appendChild(html(String(value)))
          else dd.appendChild(document.createTextNode(String(value ?? '')))
          return el('div', {}, [el('dt', {}, [label]), dd])
        }

        function linkText(value) {
          const text = String(value ?? '')
          return text.replace(/\bhttps?:\/\/[^\s<>"']+/g, (url) => {
            const safe = escapeAttr(url)
            return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>`
          })
        }

        function buildSearchText(finding) {
          return [
            finding.title,
            finding.summary,
            finding.group,
            finding.lens,
            finding.location,
            finding.trigger,
            finding.violatedContract,
            ...(finding.executionPath || []),
            ...(finding.evidence || []),
          ]
            .filter(Boolean)
            .join(' ')
        }

        function statusTone(status) {
          if (status === 'checked') return 'ok'
          if (status === 'finding') return 'warn'
          if (status === 'unverified') return 'unverified'
          return 'muted'
        }

        function titleCase(value) {
          return String(value || '')
            .split(/[-_\s]+/)
            .filter(Boolean)
            .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
            .join(' ')
        }

        function formatWhen(iso) {
          if (!iso) return 'Unknown time'
          try {
            const d = new Date(iso)
            return Number.isNaN(d.getTime()) ? iso : d.toLocaleString()
          } catch {
            return iso
          }
        }

        function escapeHtml(value) {
          return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
        }

        function escapeAttr(value) {
          return escapeHtml(value).replaceAll("'", '&#39;')
        }

        function html(value) {
          const template = document.createElement('template')
          template.innerHTML = value
          return template.content
        }

        function el(tag, attrs, kids) {
          const node = document.createElement(tag)
          for (const [key, value] of Object.entries(attrs || {})) {
            if (value == null || value === false) continue
            if (key === 'style' && typeof value === 'string') node.setAttribute('style', value)
            else node.setAttribute(key, String(value))
          }
          for (const kid of kids || []) {
            if (kid == null || kid === false) continue
            if (typeof kid === 'string') node.appendChild(document.createTextNode(kid))
            else if (kid instanceof DocumentFragment) node.appendChild(kid)
            else node.appendChild(kid)
          }
          return node
        }
      })()
    </script>
  </body>
</html>
