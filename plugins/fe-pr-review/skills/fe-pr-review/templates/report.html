<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frontend PR Review</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b0f;
        --bg-subtle: #0e1117;
        --surface: #12161d;
        --surface-2: #171c25;
        --surface-3: #1d2430;
        --ink: #eef1f6;
        --muted: #a7b0bf;
        --faint: #727b8a;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --accent: #5b9dff;
        --accent-soft: rgba(91, 157, 255, 0.12);
        --blocked: #ff7b72;
        --blocked-bg: rgba(255, 123, 114, 0.1);
        --blocked-line: rgba(255, 123, 114, 0.35);
        --passable: #3dd68c;
        --passable-bg: rgba(61, 214, 140, 0.1);
        --passable-line: rgba(61, 214, 140, 0.35);
        --unverified: #f0b429;
        --unverified-bg: rgba(240, 180, 41, 0.1);
        --unverified-line: rgba(240, 180, 41, 0.35);
        --warn: #ffb86b;
        --ok: #7ee787;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        --radius: 10px;
        --radius-sm: 6px;
        --font: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Helvetica Neue", sans-serif;
        --mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
        --sidebar: 240px;
      }

      html[data-theme="light"] {
        color-scheme: light;
        --bg: #f6f7f9;
        --bg-subtle: #eef0f4;
        --surface: #ffffff;
        --surface-2: #fbfbfc;
        --surface-3: #f3f4f7;
        --ink: #111827;
        --muted: #4b5563;
        --faint: #6b7280;
        --line: rgba(17, 24, 39, 0.08);
        --line-strong: rgba(17, 24, 39, 0.14);
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.08);
        --blocked: #dc2626;
        --blocked-bg: #fef2f2;
        --blocked-line: rgba(220, 38, 38, 0.25);
        --passable: #059669;
        --passable-bg: #ecfdf5;
        --passable-line: rgba(5, 150, 105, 0.25);
        --unverified: #b45309;
        --unverified-bg: #fffbeb;
        --unverified-line: rgba(180, 83, 9, 0.25);
        --warn: #d97706;
        --ok: #059669;
        --shadow: 0 12px 40px rgba(17, 24, 39, 0.08);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
      }

      .skip {
        position: absolute;
        left: 12px;
        top: -40px;
        z-index: 40;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: #fff;
        font: 650 12px/1 var(--font);
      }

      .skip:focus {
        top: 12px;
        text-decoration: none;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      a[target="_blank"]::after {
        content: " ↗";
        font-size: 0.85em;
        opacity: 0.65;
      }

      code,
      .mono {
        font-family: var(--mono);
        font-size: 0.92em;
      }

      .top {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 52px;
        padding: 0 20px;
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .mark {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
        flex: 0 0 auto;
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-copy strong {
        display: block;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .brand-copy span {
        display: block;
        color: var(--faint);
        font: 11px/1.2 var(--mono);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .top-jump {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2px;
        min-width: 0;
      }

      .top-jump a {
        padding: 6px 8px;
        border-radius: 999px;
        color: var(--muted);
        font: 650 11px/1 var(--font);
      }

      .top-jump a:hover,
      .top-jump a.is-active {
        background: var(--accent-soft);
        color: var(--ink);
        text-decoration: none;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--line-strong);
        background: var(--surface-2);
        color: var(--muted);
        border-radius: var(--radius-sm);
        padding: 6px 10px;
        font: 650 11px/1 var(--font);
        cursor: pointer;
      }

      .btn:hover {
        color: var(--ink);
        border-color: var(--line-strong);
        background: var(--surface-3);
      }

      .badge {
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 5px 8px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        color: var(--faint);
      }

      .verdict {
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .verdict-inner {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 18px 0 16px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: end;
      }

      .verdict h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 38px);
        line-height: 1.05;
        letter-spacing: -0.04em;
        font-weight: 700;
      }

      .verdict[data-tone="blocked"] h1 {
        color: var(--blocked);
      }
      .verdict[data-tone="passable"] h1 {
        color: var(--passable);
      }
      .verdict[data-tone="unverified"] h1 {
        color: var(--unverified);
      }

      .verdict p {
        margin: 8px 0 0;
        max-width: 62ch;
        color: var(--muted);
        font-size: 14px;
      }

      .verdict-chip {
        justify-self: end;
        padding: 10px 14px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--surface-2);
        font: 650 11px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .verdict[data-tone="blocked"] .verdict-chip {
        border-color: var(--blocked-line);
        background: var(--blocked-bg);
        color: var(--blocked);
      }
      .verdict[data-tone="passable"] .verdict-chip {
        border-color: var(--passable-line);
        background: var(--passable-bg);
        color: var(--passable);
      }
      .verdict[data-tone="unverified"] .verdict-chip {
        border-color: var(--unverified-line);
        background: var(--unverified-bg);
        color: var(--unverified);
      }

      .exec {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 20px 22px;
        box-shadow: var(--shadow);
      }

      .exec-kicker {
        margin: 0 0 8px;
        color: var(--faint);
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .exec-headline {
        margin: 0;
        font-size: 20px;
        line-height: 1.25;
        letter-spacing: -0.03em;
        font-weight: 650;
      }

      .exec-rationale {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        max-width: 68ch;
      }

      .exec-bullets {
        margin: 16px 0 0;
        padding-left: 18px;
        color: var(--muted);
        display: grid;
        gap: 6px;
        font-size: 13.5px;
      }

      .exec-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-top: 18px;
      }

      .exec-stat {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface-2);
      }

      .exec-stat b {
        display: block;
        font: 700 20px/1 var(--mono);
      }

      .exec-stat span {
        display: block;
        margin-top: 4px;
        color: var(--faint);
        font: 650 9px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .exec-stat[data-tone="blocked"] b {
        color: var(--blocked);
      }
      .exec-stat[data-tone="passable"] b {
        color: var(--passable);
      }
      .exec-stat[data-tone="unverified"] b {
        color: var(--unverified);
      }
      .exec-stat[data-tone="ok"] b {
        color: var(--ok);
      }

      .exec-decision {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--surface-2);
      }

      .exec-decision strong {
        display: block;
        font-size: 13px;
      }

      .exec-decision span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }

      .verdict[data-tone="blocked"] .exec-decision {
        border-color: var(--blocked-line);
        background: var(--blocked-bg);
      }
      .verdict[data-tone="passable"] .exec-decision,
      .exec[data-tone="passable"] .exec-decision {
        border-color: var(--passable-line);
        background: var(--passable-bg);
      }
      .exec[data-tone="blocked"] .exec-decision {
        border-color: var(--blocked-line);
        background: var(--blocked-bg);
      }
      .exec[data-tone="unverified"] .exec-decision {
        border-color: var(--unverified-line);
        background: var(--unverified-bg);
      }

      .action-list {
        display: grid;
        gap: 8px;
        margin-top: 16px;
      }

      .action-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: start;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface-2);
      }

      .action-num {
        font: 700 12px/1 var(--mono);
        color: var(--faint);
        padding-top: 2px;
      }

      .action-copy strong {
        display: block;
        font-size: 14px;
        letter-spacing: -0.02em;
      }

      .action-copy p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .action-copy .loc {
        margin-top: 6px;
        color: var(--faint);
        font: 11px/1.3 var(--mono);
      }

      .action-jump {
        font: 650 11px/1 var(--font);
        white-space: nowrap;
        align-self: center;
      }

      .fold {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        overflow: hidden;
      }

      .fold summary {
        cursor: pointer;
        list-style: none;
        padding: 12px 14px;
        color: var(--muted);
        font: 650 12px/1 var(--font);
        border-bottom: 1px solid transparent;
      }

      .fold summary::-webkit-details-marker {
        display: none;
      }

      .fold[open] summary {
        border-bottom-color: var(--line);
        color: var(--ink);
      }

      .fold-body {
        padding: 14px;
      }

      .reading-hint {
        margin: 0 0 14px;
        color: var(--faint);
        font-size: 12px;
      }

      .finding-lede {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.45;
      }

      .finding-fix {
        margin: 10px 0 0;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        background: var(--bg-subtle);
        color: var(--muted);
        font-size: 12.5px;
      }

      .finding-fix strong {
        color: var(--ink);
      }

      .guide {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .guide a {
        display: grid;
        gap: 4px;
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink);
        text-decoration: none;
      }

      .guide a:hover,
      .guide a.is-current {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
        background: var(--accent-soft);
        text-decoration: none;
      }

      .guide b {
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
      }

      .guide strong {
        font-size: 13px;
        letter-spacing: -0.02em;
      }

      .guide span {
        color: var(--faint);
        font-size: 12px;
      }

      .section-next {
        display: inline-flex;
        margin-top: 12px;
        font: 650 12px/1 var(--font);
      }

      .nav-group {
        margin: 10px 0 4px;
        color: var(--faint);
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .nav-sub {
        display: grid;
        gap: 2px;
        margin: 0 0 6px 8px;
      }

      .nav-sub a {
        font-size: 12px;
        padding: 5px 8px;
      }

      .search-hint {
        margin: 6px 0 0;
        color: var(--faint);
        font-size: 11px;
      }

      .search-hint kbd {
        font: 650 10px/1 var(--mono);
        padding: 1px 4px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--surface-2);
      }

      .is-target {
        outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
        outline-offset: 3px;
        animation: target-pulse 1.4s ease;
      }

      @keyframes target-pulse {
        from {
          outline-color: var(--accent);
        }
        to {
          outline-color: transparent;
        }
      }

      .layout {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 20px 0 56px;
        display: grid;
        grid-template-columns: var(--sidebar) minmax(0, 1fr);
        gap: 28px;
        align-items: start;
      }

      .sidebar {
        position: sticky;
        top: 72px;
        display: grid;
        gap: 14px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px;
        box-shadow: var(--shadow);
      }

      .panel h2 {
        margin: 0 0 10px;
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
      }

      .search {
        width: 100%;
        border: 1px solid var(--line-strong);
        background: var(--bg-subtle);
        color: var(--ink);
        border-radius: var(--radius-sm);
        padding: 9px 10px;
        font: 13px/1.2 var(--font);
      }

      .search::placeholder {
        color: var(--faint);
      }

      .nav {
        display: grid;
        gap: 4px;
      }

      .nav a {
        display: block;
        padding: 7px 8px;
        border-radius: var(--radius-sm);
        color: var(--muted);
        font-size: 12.5px;
      }

      .nav a:hover,
      .nav a.is-active {
        background: var(--accent-soft);
        color: var(--ink);
        text-decoration: none;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .pill {
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--muted);
        border-radius: 999px;
        padding: 5px 9px;
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .pill[aria-pressed="true"] {
        border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
        background: var(--accent-soft);
        color: var(--ink);
      }

      .main {
        min-width: 0;
        display: grid;
        gap: 18px;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .meta-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        font-size: 12px;
      }

      .meta-chip strong {
        color: var(--faint);
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .copy {
        border: 0;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        padding: 0;
        font: 650 10px/1 var(--mono);
      }

      .copy:hover {
        color: var(--accent);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .metric {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 14px;
      }

      .metric b {
        display: block;
        font: 700 24px/1 var(--mono);
        letter-spacing: -0.04em;
      }

      .metric span {
        display: block;
        margin-top: 5px;
        color: var(--faint);
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .metric[data-tone="blocked"] b {
        color: var(--blocked);
      }
      .metric[data-tone="passable"] b {
        color: var(--passable);
      }
      .metric[data-tone="unverified"] b {
        color: var(--unverified);
      }

      .section {
        scroll-margin-top: 88px;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .section-head h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.03em;
        font-weight: 650;
      }

      .section-head p {
        margin: 0;
        color: var(--faint);
        font-size: 12px;
      }

      .card-list {
        display: grid;
        gap: 10px;
      }

      .card-list[data-empty="true"]::after {
        content: "No findings match this search.";
        padding: 22px 16px;
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius);
        color: var(--faint);
        background: var(--surface);
      }

      .finding {
        display: grid;
        grid-template-columns: 4px minmax(0, 1fr);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--surface);
      }

      .finding[data-hidden="true"],
      .facet-row[data-hidden="true"] {
        display: none;
      }

      .finding-rail {
        background: var(--faint);
      }

      .finding[data-group="blocking"] .finding-rail {
        background: var(--blocked);
      }
      .finding[data-group="non-blocking"] .finding-rail {
        background: var(--warn);
      }
      .finding[data-group="unverified"] .finding-rail {
        background: var(--unverified);
      }

      .finding-body {
        padding: 12px 14px 10px;
        min-width: 0;
      }

      .finding-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .finding-title {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .finding-meta {
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag {
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 4px 6px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        background: var(--surface-2);
      }

      .tag[data-tone="blocked"] {
        color: var(--blocked);
        border-color: var(--blocked-line);
        background: var(--blocked-bg);
      }
      .tag[data-tone="ok"] {
        color: var(--ok);
      }
      .tag[data-tone="unverified"] {
        color: var(--unverified);
        border-color: var(--unverified-line);
        background: var(--unverified-bg);
      }

      .finding summary {
        cursor: pointer;
        list-style: none;
        margin-top: 10px;
        color: var(--accent);
        font: 650 12px/1 var(--font);
      }

      .finding summary::-webkit-details-marker {
        display: none;
      }

      .finding details[open] summary {
        margin-bottom: 10px;
      }

      .kv {
        display: grid;
        gap: 8px;
        margin: 0;
      }

      .kv div {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        gap: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }

      .kv dt {
        margin: 0;
        color: var(--faint);
        font: 650 10px/1.4 var(--mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .kv dd {
        margin: 0;
        color: var(--muted);
      }

      .table-wrap {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: auto;
        background: var(--surface);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
      }

      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        position: sticky;
        top: 0;
        background: var(--surface-2);
        color: var(--faint);
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .status {
        font: 650 10px/1 var(--mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .status[data-tone="ok"] {
        color: var(--ok);
      }
      .status[data-tone="warn"] {
        color: var(--warn);
      }
      .status[data-tone="unverified"] {
        color: var(--unverified);
      }
      .status[data-tone="muted"] {
        color: var(--faint);
      }

      .gate-banner {
        display: grid;
        gap: 8px;
        padding: 14px 16px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: linear-gradient(180deg, var(--surface-2), var(--surface));
      }

      .gate-banner strong {
        font-size: 14px;
      }

      .gate-keys {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .empty {
        padding: 22px 16px;
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius);
        color: var(--faint);
        background: var(--surface);
      }

      .foot {
        color: var(--faint);
        font-size: 12px;
      }

      @media (max-width: 960px) {
        .layout {
          display: flex;
          flex-direction: column;
        }

        .sidebar {
          position: static;
          order: 2;
        }

        .main {
          order: 1;
        }

        .metrics,
        .exec-stats,
        .guide {
          grid-template-columns: 1fr 1fr;
        }

        .top-jump {
          display: none;
        }
      }

      @media (max-width: 640px) {
        .verdict-inner {
          grid-template-columns: 1fr;
        }

        .verdict-chip {
          justify-self: start;
        }

        .metrics {
          grid-template-columns: 1fr;
        }

        .kv div {
          grid-template-columns: 1fr;
        }
      }

      /* Simple report dashboard ------------------------------------------------ */
      :root {
        --bg: #090909;
        --bg-subtle: #0d0d0d;
        --surface: #101010;
        --surface-2: #151515;
        --surface-3: #1b1b1b;
        --ink: #f2f2f0;
        --muted: #a5a5a0;
        --faint: #74746f;
        --line: rgba(255, 255, 255, 0.1);
        --line-strong: rgba(255, 255, 255, 0.18);
        --accent: #f2f2f0;
        --accent-soft: rgba(255, 255, 255, 0.08);
        --shadow: none;
        --radius: 12px;
        --radius-sm: 8px;
        --font: ui-rounded, "SF Pro Rounded", "Nunito Sans", "Avenir Next",
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "SF Mono", "JetBrains Mono", "Cascadia Code", ui-monospace,
          Menlo, Consolas, monospace;
        --sidebar: 232px;
        --topbar: 64px;
      }

      html[data-theme="light"] {
        --bg: #fafafa;
        --bg-subtle: #f5f5f3;
        --surface: #ffffff;
        --surface-2: #f8f8f6;
        --surface-3: #efefec;
        --ink: #171715;
        --muted: #62625d;
        --faint: #8a8a84;
        --line: rgba(23, 23, 21, 0.1);
        --line-strong: rgba(23, 23, 21, 0.18);
        --accent: #171715;
        --accent-soft: rgba(23, 23, 21, 0.07);
        --shadow: none;
      }

      html {
        scroll-behavior: smooth;
      }

      html,
      body {
        background: var(--bg);
        font-size: 14px;
      }

      body {
        min-width: 320px;
      }

      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .top {
        position: sticky;
        top: 0;
        min-height: var(--topbar);
        padding: 0 22px 0 calc(var(--sidebar) + 24px);
        justify-content: flex-end;
        background: var(--bg);
        border-bottom-color: var(--line);
        backdrop-filter: none;
      }

      .brand {
        position: fixed;
        z-index: 42;
        top: 0;
        left: 0;
        width: var(--sidebar);
        height: var(--topbar);
        padding: 0 18px;
        border-right: 1px solid var(--line);
        background: var(--surface);
      }

      .mark {
        position: relative;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--ink);
        box-shadow: none;
      }

      .mark::after {
        content: "R";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--bg);
        font: 750 14px/1 var(--mono);
      }

      .brand-copy strong {
        font-size: 13px;
        font-weight: 700;
      }

      .brand-copy span {
        margin-top: 2px;
        max-width: 148px;
        font-size: 9px;
      }

      .top-jump {
        display: none;
      }

      .top-actions {
        gap: 10px;
      }

      .btn,
      .badge {
        min-height: 34px;
        border-radius: 9px;
        background: var(--surface);
      }

      .btn {
        padding-inline: 12px;
        color: var(--ink);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0 10px;
      }

      .verdict {
        margin-left: var(--sidebar);
        background: var(--bg);
      }

      .verdict-inner {
        width: auto;
        max-width: 1440px;
        margin: 0;
        padding: 20px 24px;
        align-items: center;
      }

      .verdict h1 {
        font: 750 24px/1.1 var(--font);
        letter-spacing: -0.035em;
      }

      .verdict p {
        margin-top: 6px;
        max-width: 78ch;
        font-size: 13px;
      }

      .verdict-chip {
        padding: 8px 10px;
        border-radius: 999px;
        background: transparent;
        font-size: 9px;
      }

      .layout {
        width: auto;
        margin: 0;
        padding: 22px 24px 56px calc(var(--sidebar) + 24px);
        display: block;
      }

      .sidebar {
        position: fixed;
        z-index: 25;
        top: var(--topbar);
        bottom: 0;
        left: 0;
        width: var(--sidebar);
        padding: 18px 14px 28px;
        display: grid;
        align-content: start;
        gap: 12px;
        overflow-y: auto;
        border-right: 1px solid var(--line);
        background: var(--surface);
      }

      .top-search {
        margin-right: auto;
        width: min(420px, calc(100vw - var(--sidebar) - 260px));
        min-width: 220px;
      }

      .panel {
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .panel h2 {
        margin: 0 8px 8px;
        font-size: 9px;
      }

      .search {
        height: 40px;
        padding: 0 14px;
        border-radius: 10px;
        background: var(--surface);
        font-size: 13px;
      }

      .nav {
        gap: 3px;
      }

      .nav-group {
        margin: 14px 8px 5px;
        font-size: 9px;
      }

      .nav a {
        position: relative;
        padding: 9px 10px 9px 30px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 650;
      }

      .nav a::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 12px;
        width: 7px;
        height: 7px;
        border: 1px solid currentColor;
        border-radius: 50%;
        transform: translateY(-50%);
        opacity: 0.72;
      }

      .nav a:hover {
        background: var(--surface-2);
      }

      .nav a.is-active {
        background: var(--ink);
        color: var(--bg);
      }

      .nav a.is-active::before {
        background: currentColor;
      }

      .nav-sub {
        margin-left: 14px;
        border-left: 1px solid var(--line);
      }

      .nav-sub a {
        padding: 6px 8px 6px 16px;
        font-size: 11px;
        font-weight: 500;
      }

      .nav-sub a::before {
        display: none;
      }

      .sidebar > details.panel {
        margin-top: 8px;
        border-top: 1px solid var(--line);
        border-radius: 0;
      }

      .sidebar > details.panel > summary {
        padding: 14px 8px 10px;
        font-size: 11px;
      }

      .sidebar > details.panel .fold-body {
        padding: 4px 8px 0;
      }

      .main {
        width: min(100%, 1400px);
        min-height: 520px;
        gap: 16px;
      }

      .guide {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .guide a {
        min-height: 92px;
        padding: 14px;
        border-radius: var(--radius);
        background: var(--surface);
      }

      .guide a:hover,
      .guide a.is-current {
        border-color: var(--line-strong);
        background: var(--surface-2);
      }

      .guide b {
        font-size: 9px;
      }

      .guide strong {
        font-size: 14px;
      }

      .guide span {
        line-height: 1.35;
      }

      body:not([data-page="summary"]) .guide {
        display: none;
      }

      .section[data-page-hidden="true"] {
        display: none;
      }

      .section {
        min-width: 0;
        scroll-margin-top: 86px;
      }

      .section-head {
        display: block;
        margin: 4px 0 16px;
      }

      .section-head h2 {
        font-size: 20px;
        font-weight: 720;
      }

      .section-head p {
        margin-top: 5px;
        max-width: 74ch;
        font-size: 12.5px;
      }

      .exec,
      .fold,
      .finding,
      .table-wrap,
      .gate-banner,
      .metric,
      .meta-chip,
      .empty {
        box-shadow: none;
      }

      .exec {
        padding: 20px;
      }

      .exec-headline {
        max-width: 32ch;
        font-size: 22px;
        line-height: 1.2;
      }

      .exec-rationale,
      .exec-bullets {
        max-width: 76ch;
      }

      .exec-stats {
        gap: 10px;
      }

      .exec-stat {
        min-height: 80px;
        padding: 12px 14px;
        border-radius: 9px;
      }

      .exec-stat b {
        font-size: 23px;
      }

      .action-item {
        padding: 13px 14px;
        border-radius: 9px;
      }

      .action-num {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
      }

      .finding {
        grid-template-columns: 3px minmax(0, 1fr);
      }

      .finding-body {
        padding: 15px 16px 14px;
      }

      .finding-title {
        font-size: 15px;
      }

      .finding-lede {
        max-width: 82ch;
      }

      .code-ref {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 4px 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg-subtle);
        color: var(--ink);
        font: 10.5px/1.3 var(--mono);
        overflow-wrap: anywhere;
      }

      .finding details {
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid var(--line);
      }

      .finding summary {
        margin-top: 0;
        color: var(--ink);
      }

      .kv {
        gap: 0;
      }

      .kv div {
        padding: 10px 0;
      }

      .kv dd {
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .gate-banner {
        background: var(--surface);
      }

      .table-wrap {
        border-radius: var(--radius);
      }

      th {
        background: var(--surface-2);
      }

      tbody tr:hover {
        background: var(--surface-2);
      }

      .pill {
        border-radius: 7px;
        text-transform: none;
        letter-spacing: 0;
      }

      .pill[aria-pressed="true"] {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--bg);
      }

      .is-target {
        outline-width: 1px;
        outline-color: var(--ink);
      }

      .foot {
        padding-top: 14px;
        border-top: 1px solid var(--line);
        font: 10px/1.5 var(--mono);
      }

      @media (max-width: 1080px) {
        .top-search {
          width: min(330px, calc(100vw - var(--sidebar) - 250px));
        }

        .guide,
        .exec-stats {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 760px) {
        :root {
          --topbar: 58px;
        }

        .top {
          padding: 0 14px;
        }

        .brand {
          position: static;
          width: auto;
          height: auto;
          margin-right: auto;
          padding: 0;
          border: 0;
          background: transparent;
        }

        .brand-copy span,
        .badge {
          display: none;
        }

        .mark {
          width: 30px;
          height: 30px;
        }

        .verdict {
          margin-left: 0;
        }

        .verdict-inner {
          padding: 16px;
        }

        .verdict h1 {
          font-size: 21px;
        }

        .layout {
          padding: 14px 14px 44px;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }

        .sidebar {
          position: sticky;
          top: var(--topbar);
          z-index: 20;
          order: 0;
          width: calc(100% + 28px);
          margin: 0 -14px;
          padding: 8px 14px;
          display: block;
          overflow: hidden;
          border: 0;
          border-bottom: 1px solid var(--line);
          background: var(--bg);
        }

        .top-search {
          display: none;
        }

        .sidebar > .panel:nth-child(2) {
          padding: 0;
          border: 0;
          border-radius: 0;
          background: transparent;
        }

        .nav {
          display: flex;
          gap: 6px;
          overflow-x: auto;
          scrollbar-width: none;
        }

        .nav::-webkit-scrollbar {
          display: none;
        }

        .nav > a {
          flex: 0 0 auto;
          padding: 8px 11px 8px 27px;
          white-space: nowrap;
        }

        .nav-group,
        .nav-sub,
        .sidebar .panel h2,
        .sidebar > details.panel {
          display: none;
        }

        .nav a {
          padding-left: 28px;
        }

        .main {
          order: 1;
        }

        .section {
          scroll-margin-top: calc(var(--topbar) + 58px);
        }

        .guide {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 520px) {
        .top-actions {
          gap: 6px;
        }

        .btn {
          min-height: 32px;
          padding-inline: 9px;
        }

        .verdict-inner {
          grid-template-columns: 1fr;
        }

        .verdict-chip {
          justify-self: start;
        }

        .guide,
        .exec-stats,
        .metrics {
          grid-template-columns: 1fr;
        }

        .guide a {
          min-height: 0;
        }

        .action-item {
          grid-template-columns: auto minmax(0, 1fr);
        }

        .action-jump {
          grid-column: 2;
          justify-self: start;
        }

        .kv div {
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
    </style>
  </head>
  <body data-page="summary">

    <header class="top">

        <span class="mark" aria-hidden="true"></span>

          <span id="brand-meta">Evidence report</span>
        </div>
      </div>
      <div class="top-search">
        <input
          class="search"
          id="search"
          type="search"
          aria-label="Search this report"
          placeholder="Search findings or files…"
          autocomplete="off"
        />
      </div>
      <nav class="top-jump" id="top-jump" aria-label="Jump to section"></nav>

        <button class="btn" id="theme-toggle" type="button">Light theme</button>

      </div>

    <section class="verdict" id="verdict" data-tone="unverified">
      <div class="verdict-inner">
        <div>
          <h1 id="verdict-title">Reject</h1>
          <p id="verdict-rationale">Loading report...</p>
        </div>
        <div class="verdict-chip" id="verdict-chip">Reject</div>
      </div>
    </section>

    <div class="layout">
      <aside class="sidebar">
        <div class="panel">
          <h2>Report sections</h2>
          <nav class="nav" id="nav"></nav>
        </div>
        <details class="panel fold">
          <summary>Filters</summary>
          <div class="fold-body">
            <h2>Findings</h2>
            <div class="filters" id="finding-filters"></div>
            <h2>Facets</h2>
            <div class="filters" id="facet-filters"></div>
          </div>
        </details>
      </aside>

      <main class="main" id="app"></main>
    </div>

    <script type="application/json" id="fe-review-report">
      __FE_REVIEW_REPORT_JSON__
    </script>
    <script>
      ;(function () {
        const raw = document.getElementById('fe-review-report').textContent.trim()
        let data
        try {
          data = JSON.parse(raw)
        } catch {
          data = {
            schema: 'sdlc.fe-pr-review.report/v1',
            decision: {
              value: 'REJECT',
              label: 'Reject',
              tone: 'blocked',
              reasonCodes: ['INSUFFICIENT_EVIDENCE'],
              rationale: 'Invalid report payload.',
            },
            verdict: { value: 'unverified', label: 'Unverified', tone: 'unverified', rationale: 'Invalid report payload.' },
            counts: { blocking: 0, nonBlocking: 0, unverifiedFindings: 0, facets: 0, facetsUnverified: 0 },
            findings: [],
            coverage: [],
            gatePath: [],
            qa: { status: 'not-run', reason: 'Invalid report payload.' },
            featureGate: { status: 'unverified', keys: [], rationale: '', evidence: [] },
            snapshot: { h0: 'unknown', base: 'unknown', diffHash: 'unknown', shortH0: 'unknown' },
            generatedAt: null,
          }
        }

        const app = document.getElementById('app')
        const nav = document.getElementById('nav')
        const search = document.getElementById('search')
        const themeToggle = document.getElementById('theme-toggle')
        const storedTheme = localStorage.getItem('fe-pr-review-theme')
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.dataset.theme = storedTheme
        }
        syncThemeLabel()

        themeToggle.addEventListener('click', () => {
          const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'
          document.documentElement.dataset.theme = next
          localStorage.setItem('fe-pr-review-theme', next)
          syncThemeLabel()
        })

        document.getElementById('brand-meta').textContent =
          formatWhen(data.generatedAt) + ' · H0 ' + (data.snapshot?.shortH0 || 'unknown')

        const publicDecision = data.decision?.value === 'ACCEPT' ? 'Accept' : 'Reject'
        const verdictEl = document.getElementById('verdict')
        verdictEl.dataset.tone = publicDecision === 'Accept' ? 'passable' : 'blocked'
        document.getElementById('verdict-title').textContent = publicDecision
        document.getElementById('verdict-rationale').textContent =
          data.executive?.headline || data.decision?.rationale || ''

        const readPath = [
          { id: 'summary', step: '1', title: 'What happened', hint: 'Verdict and what to do next' },
          { id: 'findings', step: '2', title: 'Findings', hint: 'Issues to act on', count: data.counts?.blocking || data.findings?.length || 0 },
          { id: 'feature-gate', step: '3', title: 'Rollout', hint: 'Feature-gate path' },
          { id: 'qa', step: '4', title: 'QA proof', hint: 'Visual evidence only if fresh' },
        ]
        const morePath = [
          { id: 'snapshot', title: 'Snapshot' },
          { id: 'coverage', title: 'Every review facet', count: data.counts?.facets },
          { id: 'follow-ups', title: 'Follow-ups', count: data.operationalFollowUps?.length },
          { id: 'limitations', title: 'Limitations', count: data.limitations?.length },
        ]
        const blockingFinds = (data.findings || []).filter((f) => f.group === 'blocking').slice(0, 5)

        renderJumpNav()
        renderTopJump()

        document.getElementById('verdict-chip').textContent = publicDecision

        app.appendChild(renderGuide())
        app.appendChild(renderExecutive(data))
        app.appendChild(renderSnapshot(data))
        app.appendChild(renderFindings(data))
        app.appendChild(renderFeatureGate(data))
        app.appendChild(renderCoverage(data))
        app.appendChild(renderFollowUps(data))
        app.appendChild(renderQa(data))
        app.appendChild(renderLimitations(data))
        app.appendChild(
          el('p', { class: 'foot' }, [
            (data.schema || 'sdlc.fe-pr-review.report/v1') +
              ' · ' +
              (data.counts?.facets || 0) +
              ' facets · read-only evidence',
          ]),
        )

        wireFindingFilters(data)
        wireFacetFilters(data)
        wireSearch()
        wireNav()
        wireKeyboard()
        revealHashTarget()
        window.addEventListener('hashchange', revealHashTarget)

        function renderGuide() {
          const navEl = el('nav', { class: 'guide', id: 'guide', 'aria-label': 'How to read this report' })
          for (const step of readPath) {
            navEl.appendChild(
              el('a', { href: '#section-' + step.id, 'data-guide': step.id }, [
                el('b', {}, ['Step ' + step.step]),
                el('strong', {}, [step.title]),
                el('span', {}, [step.hint]),
              ]),
            )
          }
          return navEl
        }

        function renderJumpNav() {
          nav.appendChild(el('div', { class: 'nav-group' }, ['Read in order']))
          for (const section of readPath) {
            const label = section.count != null ? section.title + ' · ' + section.count : section.title
            nav.appendChild(
              el('a', { href: '#section-' + section.id, 'data-nav': section.id }, [section.step + ' · ' + label]),
            )
          }
          if (blockingFinds.length) {
            const sub = el('div', { class: 'nav-sub' })
            for (const finding of blockingFinds) {
              sub.appendChild(el('a', { href: '#finding-' + finding.id }, [finding.title]))
            }
            nav.appendChild(sub)
          }
          nav.appendChild(el('div', { class: 'nav-group' }, ['Jump']))
          for (const section of morePath) {
            const label = section.count ? section.title + ' · ' + section.count : section.title

        function applyFindingFilter(id, btn) {

        function wireSearch() {
          search.addEventListener('input', () => {
            applySearch()
            if (search.value.trim() && document.body.dataset.page !== 'findings') {
              location.hash = 'section-findings'
            }
          })
          document.addEventListener('click', (event) => {
            const target = event.target
            if (!(target instanceof HTMLElement)) return
            const value = target.dataset.copy || target.dataset.copyHash
            if (!value) return
            const url = target.dataset.copyHash
              ? location.origin + location.pathname + location.search + '#' + value
              : value
            navigator.clipboard?.writeText(url)
          })
        }

        function applySearch() {
          const q = search.value.trim().toLowerCase()
          let visibleFindings = 0
          for (const node of document.querySelectorAll('.finding[data-group]')) {
            const group = node.getAttribute('data-group')
            const text = (node.getAttribute('data-search') || node.textContent || '').toLowerCase()
            const groupOk = activeFindingFilter === 'all' || activeFindingFilter === group
            const searchOk = !q || text.includes(q)
            const visible = groupOk && searchOk
            node.setAttribute('data-hidden', String(!visible))
            if (visible) visibleFindings++
          }
          const findingList = document.getElementById('finding-list')
          if (findingList) findingList.setAttribute('data-empty', String(Boolean(q) && visibleFindings === 0))
          for (const row of document.querySelectorAll('.facet-row')) {
            const persona = row.getAttribute('data-persona')
            const status = row.getAttribute('data-status')
            const text = (row.getAttribute('data-search') || row.textContent || '').toLowerCase()
            const personaOk = activeFacetFilter === 'all' || activeFacetFilter === persona
            const statusOk = activeFacetStatus === 'all' || activeFacetStatus === status
            const searchOk = !q || text.includes(q)
            row.setAttribute('data-hidden', String(!(personaOk && statusOk && searchOk)))
          }
        }

        function wireNav() {
          const links = [...document.querySelectorAll('[data-nav], [data-guide]')]
          for (const link of links) {
            link.addEventListener('click', () => {
              if (link.hash === location.hash) requestAnimationFrame(revealHashTarget)
            })
          }
        }

        function syncPageNav(pageId) {
          for (const link of document.querySelectorAll('[data-nav], [data-guide]')) {
            const key = link.getAttribute('data-nav') || link.getAttribute('data-guide')
            const active = key === pageId
            link.classList.toggle('is-active', active)
            if (link.hasAttribute('data-guide')) link.classList.toggle('is-current', active)
            if (active) link.setAttribute('aria-current', 'page')
            else link.removeAttribute('aria-current')
          }
        }

        function wireKeyboard() {
          document.addEventListener('keydown', (event) => {
            const typing = event.target instanceof HTMLElement && /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)
            if (event.key === '/' && !typing && !event.metaKey && !event.ctrlKey) {
              event.preventDefault()
              search.focus()
              search.select()
              return
            }
            if (event.key === 'Escape' && document.activeElement === search) {
              search.blur()
              return
            }
            if (typing || event.metaKey || event.ctrlKey || event.altKey) return
            const step = readPath.find((item) => item.step === event.key)
            if (step) location.hash = 'section-' + step.id
          })
        }

        function revealHashTarget() {
          const raw = location.hash.replace(/^#/, '')
          let id = raw || 'section-summary'
          try {
            id = decodeURIComponent(id)
          } catch {
            id = raw || 'section-summary'
          }
          const requestedTarget = document.getElementById(id)
          const target = requestedTarget || document.getElementById('section-summary')
          if (!target) return
          const page = target.classList.contains('section') ? target : target.closest('.section')
          if (!page) return
          const pageId = page.id.replace(/^section-/, '')

          for (const section of document.querySelectorAll('.section')) {
            section.setAttribute('data-page-hidden', String(section !== page))
            section.setAttribute('aria-hidden', String(section !== page))
          }
          document.body.dataset.page = pageId
          syncPageNav(pageId)

          const pageMeta = [...readPath, ...morePath].find((item) => item.id === pageId)
          const pageTitle = pageId === 'summary' ? 'Summary' : pageMeta?.title || titleCase(pageId)
          const reportTitle = document.querySelector('.brand-copy strong')?.textContent || 'PR Review'
          document.title = pageTitle + ' · ' + reportTitle

          const isDeepTarget = Boolean(raw && requestedTarget && !target.classList.contains('section'))
          const details = isDeepTarget ? target.querySelector('details') : null
          if (details) details.open = true
          document.querySelectorAll('.is-target').forEach((node) => node.classList.remove('is-target'))
          if (isDeepTarget) target.classList.add('is-target')
          requestAnimationFrame(() => {
            if (raw && requestedTarget) target.scrollIntoView({ block: 'start', behavior: 'smooth' })
            else window.scrollTo({ top: 0, behavior: 'auto' })
          })
        }

        function syncThemeLabel() {
          const light = document.documentElement.dataset.theme === 'light'
          themeToggle.textContent = light ? 'Dark' : 'Light'
          themeToggle.setAttribute('aria-label', light ? 'Use dark theme' : 'Use light theme')
        }

          return el('a', { class: 'section-next', href: '#section-' + id }, [label + ' →'])
        }

        function sectionShell(id, title, helper) {
          return el('section', { class: 'section', id: 'section-' + id }, [
            el('div', { class: 'section-head' }, [el('h2', {}, [title]), el('p', {}, [helper])]),
          ])

        function metaChip(label, value, copyKey, withButton = true) {
          const chip = el('span', { class: 'meta-chip' }, [
            el('strong', {}, [label]),
            el('span', { class: 'mono' }, [value || 'unknown']),
          ])
          if (withButton && copyKey) {

          }
          return chip
        }

        function tag(label, tone) {
          return el('span', { class: 'tag', 'data-tone': tone || 'muted' }, [label])
        }

        function kvRow(label, value) {
          const dd = el('dd', {})
          appendLinkedText(dd, value)
          return el('div', {}, [el('dt', {}, [label]), dd])
        }

        function kvEvidenceRow(label, items) {
          const dd = el('dd', {})
          appendLinkedList(dd, items, '\n')
          return el('div', {}, [el('dt', {}, [label]), dd])
        }

        function appendLinkedText(parent, text) {
          const raw = String(text ?? '')
          const urlRe = /\bhttps?:\/\/[^\s<>"']+/g
          let last = 0
          for (const match of raw.matchAll(urlRe)) {
            const url = match[0]
            const start = match.index ?? 0
            if (start > last) parent.appendChild(document.createTextNode(raw.slice(last, start)))
            const link = document.createElement('a')
            link.href = url
            link.target = '_blank'
            link.rel = 'noopener noreferrer'
            link.textContent = url
            parent.appendChild(link)
            last = start + url.length
          }
          if (last < raw.length) parent.appendChild(document.createTextNode(raw.slice(last)))
          return parent
        }

        function appendLinkedList(parent, items, separator) {
          const list = items || []
          for (let i = 0; i < list.length; i++) {
            if (i) parent.appendChild(document.createTextNode(separator))
            appendLinkedText(parent, list[i])
          }
          return parent
        }

        function linkedCell(items) {
          const cell = document.createDocumentFragment()
          appendLinkedList(cell, items || [], '; ')
          return cell
        }

        function linkedParagraph(items, style) {
          const p = el('p', { style })
          appendLinkedList(p, items || [], ' · ')
          return p
        }

        function buildSearchText(finding) {
          return [
            finding.title,
            finding.summary,
            finding.group,
            finding.lens,
            finding.location,
            finding.trigger,
            finding.violatedContract,
            ...(finding.executionPath || []),
            ...(finding.evidence || []),
          ]
            .filter(Boolean)
            .join(' ')
        }

        function statusTone(status) {
          if (status === 'checked') return 'ok'
          if (status === 'finding') return 'warn'
          if (status === 'unverified') return 'unverified'
          return 'muted'
        }

        function titleCase(value) {
          return String(value || '')
            .split(/[-_\s]+/)
            .filter(Boolean)
            .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
            .join(' ')
        }

        function formatWhen(iso) {
          if (!iso) return 'Unknown time'
          try {
            const d = new Date(iso)
            return Number.isNaN(d.getTime()) ? iso : d.toLocaleString()
          } catch {
            return iso
          }
        }

        function el(tag, attrs, kids) {
          const node = document.createElement(tag)
          for (const [key, value] of Object.entries(attrs || {})) {
            if (value == null || value === false) continue
            if (key === 'style' && typeof value === 'string') node.setAttribute('style', value)
            else node.setAttribute(key, String(value))
          }
          for (const kid of kids || []) {
            if (kid == null || kid === false) continue
            if (typeof kid === 'string') node.appendChild(document.createTextNode(kid))
            else if (kid instanceof DocumentFragment) node.appendChild(kid)
            else node.appendChild(kid)
          }
          return node
        }
      })()
    </script>
  </body>
</html>
